<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>忘れ物チェッカー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding-bottom: 80px;
    }

    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      text-align: center;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
    }

    .header .date {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 4px;
    }

    .progress-area {
      text-align: center;
      padding: 20px;
      color: white;
    }

    .progress-ring {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      position: relative;
    }

    .progress-ring svg {
      transform: rotate(-90deg);
      width: 120px;
      height: 120px;
    }

    .progress-ring circle {
      fill: none;
      stroke-width: 8;
      cx: 60;
      cy: 60;
      r: 52;
    }

    .progress-bg { stroke: rgba(255,255,255,0.2); }

    .progress-fill {
      stroke: #4ade80;
      stroke-linecap: round;
      stroke-dasharray: 326.73;
      stroke-dashoffset: 326.73;
      transition: stroke-dashoffset 0.5s ease;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      font-weight: 800;
    }

    .progress-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .message {
      background: rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 0 20px 16px;
      color: white;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 20px;
      margin-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab.active {
      background: white;
      color: #667eea;
    }

    .checklist {
      padding: 0 16px;
    }

    .category-title {
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px 8px 6px;
    }

    .item {
      background: white;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .item.checked {
      background: #f0fdf4;
      opacity: 0.7;
    }

    .item.checked .item-name {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .checkbox {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .item.checked .checkbox {
      background: #4ade80;
      border-color: #4ade80;
    }

    .checkbox::after {
      content: '✓';
      color: white;
      font-size: 16px;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .item.checked .checkbox::after { opacity: 1; }

    .item-icon {
      font-size: 24px;
      flex-shrink: 0;
    }

    .item-info { flex: 1; }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .item-note {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 2px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      padding: 12px 20px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      gap: 12px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      z-index: 100;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset {
      background: #f3f4f6;
      color: #6b7280;
    }

    .btn-edit {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.show { display: flex; }

    .modal {
      background: white;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h2 {
      font-size: 18px;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal-section { margin-bottom: 16px; }

    .modal-section label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .modal-section input,
    .modal-section select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    .modal-section input:focus,
    .modal-section select:focus {
      border-color: #667eea;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions .btn { font-size: 15px; }

    .edit-item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .edit-item-row .item-icon { font-size: 20px; }
    .edit-item-row .item-name { flex: 1; font-size: 14px; }

    .edit-btn {
      background: none;
      border: none;
      color: #667eea;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }

    .complete-banner {
      display: none;
      text-align: center;
      padding: 20px;
      color: white;
    }

    .complete-banner.show { display: block; }

    .complete-banner .emoji { font-size: 48px; }

    .complete-banner .text {
      font-size: 18px;
      font-weight: 700;
      margin-top: 8px;
    }

    .day-selector {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .day-chip {
      padding: 6px 10px;
      border-radius: 8px;
      border: 2px solid #e5e7eb;
      font-size: 13px;
      cursor: pointer;
      background: white;
      transition: all 0.2s;
    }

    .day-chip.active {
      background: #667eea;
      border-color: #667eea;
      color: white;
    }

    .streak-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: white;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎒 忘れ物チェッカー</h1>
    <div class="date" id="dateDisplay"></div>
  </div>

  <div class="progress-area">
    <div class="progress-ring">
      <svg>
        <circle class="progress-bg"/>
        <circle class="progress-fill" id="progressFill"/>
      </svg>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <div class="progress-label" id="progressLabel">持ち物を確認しよう！</div>
    <div class="streak-badge" id="streakBadge">🔥 連続 0 日達成中</div>
  </div>

  <div class="complete-banner" id="completeBanner">
    <div class="emoji">🎉</div>
    <div class="text">カンペキ！忘れ物ゼロ！</div>
  </div>

  <div class="message" id="messageBox">チェックリストを確認してね</div>

  <div class="tabs" id="tabsContainer"></div>

  <div class="checklist" id="checklist"></div>

  <div class="bottom-bar">
    <button class="btn btn-reset" onclick="resetAll()">リセット</button>
    <button class="btn btn-edit" onclick="openEditModal()">✏️ 持ち物を編集</button>
  </div>

  <!-- 追加・編集モーダル -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <h2 id="addModalTitle">持ち物を追加</h2>
      <div class="modal-section">
        <label>持ち物の名前</label>
        <input type="text" id="addName" placeholder="例: 水筒">
      </div>
      <div class="modal-section">
        <label>アイコン（絵文字）</label>
        <input type="text" id="addIcon" placeholder="例: 🥤" maxlength="4">
      </div>
      <div class="modal-section">
        <label>カテゴリ</label>
        <select id="addCategory">
          <option value="everyday">毎日</option>
          <option value="study">勉強</option>
          <option value="other">その他</option>
        </select>
      </div>
      <div class="modal-section">
        <label>曜日（持っていく日）</label>
        <div class="day-selector" id="addDays"></div>
      </div>
      <div class="modal-section">
        <label>メモ（任意）</label>
        <input type="text" id="addNote" placeholder="例: 冷蔵庫の中">
      </div>
      <div class="modal-actions">
        <button class="btn btn-reset" onclick="closeAddModal()">キャンセル</button>
        <button class="btn btn-edit" id="addModalSaveBtn" onclick="saveNewItem()">追加する</button>
      </div>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>持ち物リストを編集</h2>
      <div id="editList"></div>
      <div class="modal-actions">
        <button class="btn btn-reset" onclick="closeEditModal()">閉じる</button>
        <button class="btn btn-edit" onclick="openAddModal()">＋ 追加する</button>
      </div>
    </div>
  </div>

<script>
const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
const DAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

const DEFAULT_ITEMS = [
  { id: 1,  icon: '📚', name: '教科書・ノート', category: 'everyday', note: '時間割を確認', days: ['mon','tue','wed','thu','fri'] },
  { id: 2,  icon: '✏️', name: '筆箱', category: 'everyday', note: '', days: ['mon','tue','wed','thu','fri'] },
  { id: 3,  icon: '📓', name: '連絡帳', category: 'everyday', note: '', days: ['mon','tue','wed','thu','fri'] },
  { id: 4,  icon: '🍱', name: 'お弁当', category: 'everyday', note: '冷蔵庫チェック', days: ['mon','tue','wed','thu','fri'] },
  { id: 5,  icon: '🥤', name: '水筒', category: 'everyday', note: '', days: ['mon','tue','wed','thu','fri'] },
  { id: 6,  icon: '🤧', name: 'ハンカチ・ティッシュ', category: 'everyday', note: '', days: ['mon','tue','wed','thu','fri'] },
  { id: 7,  icon: '🔑', name: '家の鍵', category: 'everyday', note: '', days: ['mon','tue','wed','thu','fri','sat','sun'] },
  { id: 8,  icon: '💳', name: '定期・ICカード', category: 'everyday', note: '', days: ['mon','tue','wed','thu','fri'] },
  { id: 9,  icon: '🏃', name: '体操服', category: 'study', note: '体育がある日', days: ['mon','thu'] },
  { id: 10, icon: '👟', name: '体育館シューズ', category: 'study', note: '', days: ['mon','thu'] },
  { id: 11, icon: '🎨', name: '美術セット', category: 'study', note: '', days: ['tue'] },
  { id: 12, icon: '🎵', name: 'リコーダー', category: 'study', note: '音楽がある日', days: ['wed'] },
  { id: 13, icon: '🔬', name: '理科の実験道具', category: 'study', note: '', days: ['fri'] },
  { id: 14, icon: '📋', name: '提出物・プリント', category: 'other', note: '前日に確認', days: ['mon','tue','wed','thu','fri'] },
  { id: 15, icon: '☂️', name: '折りたたみ傘', category: 'other', note: '天気予報チェック', days: ['mon','tue','wed','thu','fri'] },
  { id: 16, icon: '😷', name: 'マスク（予備）', category: 'other', note: '', days: ['mon','tue','wed','thu','fri'] },
];

const CATEGORIES = {
  everyday: '🔵 毎日の持ち物',
  study: '🟢 授業で使うもの',
  other: '🟡 その他'
};

const MESSAGES = [
  '今日も忘れ物ゼロを目指そう！',
  '一つずつ確認していこう💪',
  'チェックしたら安心だね！',
  '出発前にもう一度確認！',
  'カバンに入れたらチェック✓',
];

let items = [];
let checkedItems = {};
let streak = 0;
let selectedTab = 'all';
let addDaysSelected = ['mon','tue','wed','thu','fri'];

function init() {
  loadData();
  updateDateDisplay();
  renderTabs();
  renderChecklist();
  updateProgress();
  updateStreak();
  showRandomMessage();
  autoResetIfNewDay();
}

function loadData() {
  const saved = localStorage.getItem('wasure_items');
  items = saved ? JSON.parse(saved) : [...DEFAULT_ITEMS];

  const savedChecks = localStorage.getItem('wasure_checked');
  checkedItems = savedChecks ? JSON.parse(savedChecks) : {};

  streak = parseInt(localStorage.getItem('wasure_streak') || '0');
}

function saveData() {
  localStorage.setItem('wasure_items', JSON.stringify(items));
  localStorage.setItem('wasure_checked', JSON.stringify(checkedItems));
  localStorage.setItem('wasure_streak', streak.toString());
}

function autoResetIfNewDay() {
  const lastDate = localStorage.getItem('wasure_lastDate');
  const today = new Date().toDateString();
  if (lastDate && lastDate !== today) {
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate() - 1);
    if (lastDate === yesterday.toDateString()) {
      const todayItems = getTodayItems();
      const allChecked = todayItems.length > 0 && todayItems.every(i => checkedItems[i.id]);
      if (allChecked) {
        streak++;
      } else {
        streak = 0;
      }
    }
    checkedItems = {};
    saveData();
    renderChecklist();
    updateProgress();
    updateStreak();
  }
  localStorage.setItem('wasure_lastDate', today);
}

function getTodayDayKey() {
  return DAY_KEYS[new Date().getDay()];
}

function getTodayItems() {
  const today = getTodayDayKey();
  return items.filter(i => i.days.includes(today));
}

function getFilteredItems() {
  let list = getTodayItems();
  if (selectedTab !== 'all') {
    list = list.filter(i => i.category === selectedTab);
  }
  return list;
}

function updateDateDisplay() {
  const now = new Date();
  const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('dateDisplay').textContent = now.toLocaleDateString('ja-JP', opts);
}

function renderTabs() {
  const container = document.getElementById('tabsContainer');
  const todayItems = getTodayItems();
  const tabs = [{ key: 'all', label: `すべて (${todayItems.length})` }];

  for (const [key, label] of Object.entries(CATEGORIES)) {
    const count = todayItems.filter(i => i.category === key).length;
    if (count > 0) tabs.push({ key, label: `${label.split(' ')[0]} ${label.split(' ')[1]} (${count})` });
  }

  container.innerHTML = tabs.map(t =>
    `<button class="tab ${selectedTab === t.key ? 'active' : ''}" onclick="selectTab('${t.key}')">${t.label}</button>`
  ).join('');
}

function selectTab(key) {
  selectedTab = key;
  renderTabs();
  renderChecklist();
}

function renderChecklist() {
  const container = document.getElementById('checklist');
  const filtered = getFilteredItems();

  if (filtered.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:white;padding:40px;opacity:0.7;">今日はこのカテゴリの持ち物はないよ 🎉</div>';
    return;
  }

  const grouped = {};
  for (const item of filtered) {
    if (!grouped[item.category]) grouped[item.category] = [];
    grouped[item.category].push(item);
  }

  let html = '';
  for (const [cat, catItems] of Object.entries(grouped)) {
    if (selectedTab === 'all') {
      html += `<div class="category-title">${CATEGORIES[cat]}</div>`;
    }
    for (const item of catItems) {
      const checked = checkedItems[item.id] ? 'checked' : '';
      html += `
        <div class="item ${checked}" onclick="toggleItem(${item.id})" id="item-${item.id}">
          <div class="checkbox"></div>
          <div class="item-icon">${item.icon}</div>
          <div class="item-info">
            <div class="item-name">${item.name}</div>
            ${item.note ? `<div class="item-note">${item.note}</div>` : ''}
          </div>
        </div>
      `;
    }
  }

  container.innerHTML = html;
}

function toggleItem(id) {
  if (checkedItems[id]) {
    delete checkedItems[id];
  } else {
    checkedItems[id] = true;
  }
  saveData();

  const el = document.getElementById(`item-${id}`);
  if (el) {
    el.classList.toggle('checked');
  }

  updateProgress();
}

function updateProgress() {
  const todayItems = getTodayItems();
  const total = todayItems.length;
  const checked = todayItems.filter(i => checkedItems[i.id]).length;
  const pct = total === 0 ? 100 : Math.round((checked / total) * 100);

  const circumference = 326.73;
  const offset = circumference - (pct / 100) * circumference;
  document.getElementById('progressFill').style.strokeDashoffset = offset;
  document.getElementById('progressText').textContent = `${pct}%`;

  const banner = document.getElementById('completeBanner');
  if (pct === 100 && total > 0) {
    document.getElementById('progressLabel').textContent = 'すべて準備OK！';
    banner.classList.add('show');
  } else {
    document.getElementById('progressLabel').textContent = `${checked} / ${total} アイテム確認済み`;
    banner.classList.remove('show');
  }
}

function updateStreak() {
  document.getElementById('streakBadge').textContent = `🔥 連続 ${streak} 日達成中`;
}

function showRandomMessage() {
  const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
  document.getElementById('messageBox').textContent = msg;
}

function resetAll() {
  if (confirm('今日のチェックをリセットしますか？')) {
    checkedItems = {};
    saveData();
    renderChecklist();
    updateProgress();
  }
}

let editingItemId = null;

function openEditModal() {
  const list = document.getElementById('editList');
  list.innerHTML = items.map(item => `
    <div class="edit-item-row">
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      <span style="font-size:11px;color:#9ca3af;">${item.days.map(d => DAYS[DAY_KEYS.indexOf(d)]).join('')}</span>
      <button class="edit-btn" onclick="openEditItemModal(${item.id})">✏️</button>
      <button class="delete-btn" onclick="deleteItem(${item.id})">×</button>
    </div>
  `).join('');
  document.getElementById('editModal').classList.add('show');
}

function openEditItemModal(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editingItemId = id;
  document.getElementById('editModal').classList.remove('show');
  document.getElementById('addModalTitle').textContent = '持ち物を編集';
  document.getElementById('addModalSaveBtn').textContent = '保存する';
  document.getElementById('addModalSaveBtn').setAttribute('onclick', 'saveEditedItem()');
  document.getElementById('addName').value = item.name;
  document.getElementById('addIcon').value = item.icon;
  document.getElementById('addCategory').value = item.category;
  document.getElementById('addNote').value = item.note || '';
  addDaysSelected = [...item.days];
  renderDaySelector();
  document.getElementById('addModal').classList.add('show');
}

function saveEditedItem() {
  const name = document.getElementById('addName').value.trim();
  const icon = document.getElementById('addIcon').value.trim() || '📦';
  const category = document.getElementById('addCategory').value;
  const note = document.getElementById('addNote').value.trim();

  if (!name) {
    alert('持ち物の名前を入力してね！');
    return;
  }
  if (addDaysSelected.length === 0) {
    alert('少なくとも1つの曜日を選んでね！');
    return;
  }

  const item = items.find(i => i.id === editingItemId);
  if (item) {
    item.name = name;
    item.icon = icon;
    item.category = category;
    item.note = note;
    item.days = [...addDaysSelected];
    saveData();
  }
  editingItemId = null;
  document.getElementById('addModal').classList.remove('show');
  openEditModal();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  renderTabs();
  renderChecklist();
  updateProgress();
}

function deleteItem(id) {
  if (confirm('この持ち物を削除しますか？')) {
    items = items.filter(i => i.id !== id);
    delete checkedItems[id];
    saveData();
    openEditModal();
  }
}

function openAddModal() {
  editingItemId = null;
  document.getElementById('editModal').classList.remove('show');
  document.getElementById('addModalTitle').textContent = '持ち物を追加';
  document.getElementById('addModalSaveBtn').textContent = '追加する';
  document.getElementById('addModalSaveBtn').setAttribute('onclick', 'saveNewItem()');
  document.getElementById('addName').value = '';
  document.getElementById('addIcon').value = '';
  document.getElementById('addNote').value = '';
  document.getElementById('addCategory').value = 'everyday';
  addDaysSelected = ['mon','tue','wed','thu','fri'];
  renderDaySelector();
  document.getElementById('addModal').classList.add('show');
}

function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
  openEditModal();
}

function renderDaySelector() {
  const container = document.getElementById('addDays');
  container.innerHTML = DAY_KEYS.map((key, i) =>
    `<div class="day-chip ${addDaysSelected.includes(key) ? 'active' : ''}" onclick="toggleDay('${key}')">${DAYS[i]}</div>`
  ).join('');
}

function toggleDay(key) {
  const idx = addDaysSelected.indexOf(key);
  if (idx >= 0) {
    addDaysSelected.splice(idx, 1);
  } else {
    addDaysSelected.push(key);
  }
  renderDaySelector();
}

function saveNewItem() {
  const name = document.getElementById('addName').value.trim();
  const icon = document.getElementById('addIcon').value.trim() || '📦';
  const category = document.getElementById('addCategory').value;
  const note = document.getElementById('addNote').value.trim();

  if (!name) {
    alert('持ち物の名前を入力してね！');
    return;
  }

  if (addDaysSelected.length === 0) {
    alert('少なくとも1つの曜日を選んでね！');
    return;
  }

  const maxId = items.reduce((max, i) => Math.max(max, i.id), 0);
  items.push({ id: maxId + 1, icon, name, category, note, days: [...addDaysSelected] });
  saveData();
  closeAddModal();
}

init();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
